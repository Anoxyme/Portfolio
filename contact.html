    <script>
        document.addEventListener("DOMContentLoaded", () => {
            gsap.from(".anim-contact", {
                y: 30,
                opacity: 0,
                duration: 0.8,
                stagger: 0.2,
                ease: "power3.out",
                delay: 0.4
            });

            // --- Simulation Physique Matter.js (Gravité) ---
            if (typeof Matter !== 'undefined') {
                const { Engine, Render, Runner, Bodies, Composite, Mouse, MouseConstraint } = Matter;

                const engine = Engine.create();
                const world = engine.world;
                
                const gravityBg = document.getElementById('gravity-bg');
                const page = document.querySelector('.contact-page');
                
                if (gravityBg && page) {
                    let w = page.offsetWidth;
                    let h = page.offsetHeight;

                    // Sols et murs invisibles
                    const floor = Bodies.rectangle(w / 2, h + 50, w * 2, 100, { isStatic: true });
                    const leftWall = Bodies.rectangle(-50, h / 2, 100, h * 2, { isStatic: true });
                    const rightWall = Bodies.rectangle(w + 50, h / 2, 100, h * 2, { isStatic: true });
                    
                    Composite.add(world, [floor, leftWall, rightWall]);

                    const items = document.querySelectorAll('.g-item');
                    const bodies = [];

                    items.forEach((item, i) => {
                        const width = parseInt(item.getAttribute('data-width')) || 100;
                        const height = parseInt(item.getAttribute('data-height')) || 50;
                        
                        item.style.width = width + 'px';
                        item.style.height = height + 'px';

                        const x = Math.random() * (w - width) + width / 2;
                        // Fait apparaitre les blocs au-dessus de l'écran avec un délai
                        const y = -100 - (Math.random() * 400) - (i * 120);

                        const isCircle = item.classList.contains('sticker-item');
                        
                        let body;
                        if (isCircle) {
                            body = Bodies.circle(x, y, width / 2, { 
                                restitution: 0.3, 
                                friction: 0.1,
                                density: 0.002
                            });
                        } else {
                            body = Bodies.rectangle(x, y, width, height, { 
                                chamfer: { radius: height / 2 },
                                restitution: 0.2, 
                                friction: 0.2,
                                density: 0.002
                            });
                        }
                        
                        Matter.Body.setAngle(body, Math.random() * Math.PI * 2);
                        item.body = body;
                        bodies.push(body);
                    });

                    Composite.add(world, bodies);

                    const mouse = Mouse.create(document.body);
                    const mouseConstraint = MouseConstraint.create(engine, {
                        mouse: mouse,
                        constraint: {
                            stiffness: 0.2,
                            render: { visible: false }
                        }
                    });
                    
                    // Évite que Matter.js bloque le scroll natif
                    mouseConstraint.mouse.element.removeEventListener("mousewheel", mouseConstraint.mouse.mousewheel);
                    mouseConstraint.mouse.element.removeEventListener("DOMMouseScroll", mouseConstraint.mouse.mousewheel);
                    mouseConstraint.mouse.element.removeEventListener("touchstart", mouseConstraint.mouse.mousedown);
                    mouseConstraint.mouse.element.removeEventListener("touchmove", mouseConstraint.mouse.mousemove);
                    mouseConstraint.mouse.element.removeEventListener("touchend", mouseConstraint.mouse.mouseup);

                    Composite.add(world, mouseConstraint);

                    Runner.run(Runner.create(), engine);

                    // Boucle de mise à jour DOM <-> Physics
                    function update() {
                        items.forEach((item) => {
                            const body = item.body;
                            item.style.transform = `translate(${body.position.x - item.offsetWidth / 2}px, ${body.position.y - item.offsetHeight / 2}px) rotate(${body.angle}rad)`;
                        });
                        requestAnimationFrame(update);
                    }
                    update();

                    // Gestion du redimensionnement de la fenêtre
                    window.addEventListener('resize', () => {
                        w = page.offsetWidth;
                        h = page.offsetHeight;
                        Matter.Body.setPosition(floor, { x: w / 2, y: h + 50 });
                        Matter.Body.setPosition(leftWall, { x: -50, y: h / 2 });
                        Matter.Body.setPosition(rightWall, { x: w + 50, y: h / 2 });
                    });
                }
            }
        });
    </script>
